  - name: ~/powershell
    description: Install Cascadia Code fonts
    parameters:
      command: |
        $fontTempDirectory = Join-Path $env:TEMP ([IO.Path]::GetRandomFileName())
        $fontArchive = Join-Path $fontTempDirectory 'CascadiaCode.zip'
        $fontDirectory = Join-Path $fontTempDirectory 'CascadiaCode'
        New-Item -Path $fontTempDirectory -ItemType Directory | Out-Null
        try {
          Invoke-WebRequest `
            -Uri 'https://github.com/microsoft/cascadia-code/releases/download/v2407.24/CascadiaCode-2407.24.zip' `
            -OutFile $fontArchive
          Expand-Archive -Path $fontArchive -DestinationPath $fontDirectory -Force

          $fonts = @(Get-ChildItem -Path (Join-Path $fontDirectory 'ttf\*.ttf'))
          if ($fonts.Count -eq 0) {
            throw 'The Cascadia Code archive did not contain any TTF fonts.'
          }

          $fonts | ForEach-Object {
            $destinationPath = Join-Path $env:WINDIR "Fonts\$($_.Name)"
            Copy-Item -LiteralPath $_.FullName -Destination $destinationPath -Force
            New-ItemProperty `
              -Path 'HKLM:\Software\Microsoft\Windows NT\CurrentVersion\Fonts' `
              -Name $_.BaseName `
              -Value $_.Name `
              -PropertyType String `
              -Force | Out-Null
          }
        } finally {
          if (Test-Path -LiteralPath $fontTempDirectory) {
            Remove-Item -LiteralPath $fontTempDirectory -Recurse -Force
          }
        }

  - name: ~/powershell
    description: Configure Windows developer features
    parameters:
      command: |
        $appModelUnlockPath = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
        New-Item -Path $appModelUnlockPath -Force | Out-Null
        @(
          'AllowAllTrustedApps'
          'AllowDevelopmentWithoutDevLicense'
        ) | ForEach-Object {
          New-ItemProperty `
            -Path $appModelUnlockPath `
            -Name $_ `
            -Value 1 `
            -PropertyType DWord `
            -Force | Out-Null
        }

        & "$env:SystemRoot\System32\sudo.exe" config --enable forceNewWindow
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to enable sudo (sudo exited with code $LASTEXITCODE)."
        }

userTasks:
  - name: ~/powershell
    description: Configure Windows personalization
    parameters:
      command: |
        $personalizePath = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
        New-Item -Path $personalizePath -Force | Out-Null
        @(
          'AppsUseLightTheme'
          'SystemUsesLightTheme'
        ) | ForEach-Object {
          New-ItemProperty `
            -Path $personalizePath `
            -Name $_ `
            -Value 0 `
            -PropertyType DWord `
            -Force | Out-Null
        }

        New-ItemProperty `
          -Path 'HKCU:\Control Panel\Desktop' `
          -Name 'AutoColorization' `
          -Value 1 `
          -PropertyType DWord `
          -Force | Out-Null

          $taskbarDeveloperSettingsPath = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\TaskbarDeveloperSettings'
          New-Item -Path $taskbarDeveloperSettingsPath -Force | Out-Null
          New-ItemProperty `
            -Path $taskbarDeveloperSettingsPath `
            -Name 'TaskbarEndTask' `
            -Value 1 `
            -PropertyType DWord `
            -Force | Out-Null

